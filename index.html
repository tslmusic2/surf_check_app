<!DOCTYPE html>
<html lang="en">

        <head>
                <link rel="stylesheet" href="styles.css">
                <meta charset="utf-8">
                <meta name="viewport" content="width=device-width initial-scale=1">

                <link rel="preconnect" href="https://fonts.googleapis.com">
                <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
                <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Quicksand&display=swap" rel="stylesheet">

                <title>Surf Check</title>
        </head>


        <body>

                <main>

                        <section class="surf-spot-pawleys-island">

                                <div class="surf-report" data-id="1">

                                        <img class="img surf-spot-img" src="images/surf-pi-wave.jpg">
                                
                                        <h1 class="surf-spot-name">Pawleys Island Pier</h1>
                                        <p class="surf-spot-Location">Pawleys Island, SC  USA</p>

                                        <p class="user-surf-stat" id="user-surf-stat-height">Surf Height: 3ft</p>
                                        <p class="user-surf-stat" id="user-surf-stat-wind">Condition: Fair</p>
                                        <p class="user-surf-stat" id="user-surf-stat-crowd">Crowd: light</p>

                                        

                                        <button class="btn btn-add-user-report" id="btn-add-user-report">Add User Report</button>

                                        <form class="update-form" action="#" method="POST" >
                                                <label>
                                                Surf Height:
                                                <input
                                                        type="number"
                                                        name="waveHeight"
                                                        min="0"
                                                        step="0.5"
                                                        value="3"
                                                >
                                                </label>

                                                <label>
                                                Condition:
                                                <select name="condition">
                                                        <option value="clean">Clean</option>
                                                        <option value="fair">Fair</option>
                                                        <option value="choppy">Choppy</option>
                                                        <option value="poor">Poor</option>
                                                </select>
                                                </label>

                                                <label>
                                                Crowd:
                                                <select name="crowd">
                                                        <option value="light">Light</option>
                                                        <option value="medium" selected>Medium</option>
                                                        <option value="heavy">Heavy</option>
                                                </select>
                                                </label>

                                                <button class="btn btn-add-update" id="btn-add-update" type="submit">Add Update</button>
                                        </form>
                                </div>


                                <div class="user-surf-comment-container" id="user-surf-comment-container">

                                        <h3 class="user-surf-stat-comment">Comments</h3>
                                        <p class="user-surf-stat-comment" id="user-surf-stat-comment">about as good as it gets for here.  nice sand bar just off the pier with good shape on a right</p>


                                        <form>
                                                <button class="btn btn-add-user-comment" id="btn-add-user-comment">Add Comment</button>

                                                <label>
                                                        Name:
                                                        <input
                                                                type="name"
                                                                name="name"
                                                                
                                                        >
                                                </label>

                                                <label>
                                                        Comment:
                                                        <textarea>

                                                        </textarea>
                                                </label>
                                        </form>

                                </div>
                        </section>

                </main>

                <script type="module" src=""></script>
        </body>
</html>
